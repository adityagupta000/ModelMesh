services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres/modelmesh
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    restart: on-failure

  doc-ocr-worker:
    build:
      context: .
      dockerfile: workers/doc_ocr/Dockerfile
    ports:
      - "8001:8001"
      - "50051:50051"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
    restart: on-failure

  asr-worker:
    build:
      context: .
      dockerfile: workers/asr/Dockerfile
    ports:
      - "8002:8002"
      - "50052:50051"
    depends_on:
      - redis
    environment:
      - WHISPER_MODEL=tiny
      - REDIS_URL=redis://redis:6379
    restart: on-failure

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: modelmesh
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d modelmesh"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  # kafka is commented out — bitnami/kafka no longer free on Docker Hub.
  # Kafka alternative implementation exists in gateway/kafka_queue.py and
  # workers/*/kafka_consumer.py. To re-enable, use apache/kafka:3.9.0
  # and update env var names (remove CFG_ prefix).

volumes:
  pgdata:
  redisdata:
