apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-worker
  namespace: modelmesh
spec:
  replicas: 1
  selector:
    matchLabels: { app: asr-worker }
  template:
    metadata:
      labels: { app: asr-worker }
    spec:
      containers:
        - name: asr-worker
          image: modelmesh-asr:latest
          imagePullPolicy: Never
          env:
            - name: WHISPER_MODEL
              value: "tiny"
            - name: REDIS_URL
              value: "redis://redis:6379"
          ports:
            - containerPort: 8002
            - containerPort: 50051
          resources:
            requests: { cpu: "500m", memory: "1200Mi" }
            limits: { cpu: "1", memory: "1800Mi" }
