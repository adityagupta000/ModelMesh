apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-ocr-worker
  namespace: modelmesh
spec:
  replicas: 1
  selector:
    matchLabels: { app: doc-ocr-worker }
  template:
    metadata:
      labels: { app: doc-ocr-worker }
    spec:
      containers:
        - name: doc-ocr-worker
          image: modelmesh-doc-ocr:latest
          imagePullPolicy: Never
          env:
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: WORKER_NAME
              value: "doc-ocr-worker"
            - name: MAX_UPLOAD_BYTES
              value: "10485760"
            - name: RECLAIM_IDLE_MS
              value: "300000"
            - name: GRPC_MAX_WORKERS
              value: "3"
            - name: STREAM_MAXLEN
              value: "10000"
            - name: PAYLOAD_TTL_SECONDS
              value: "3600"
          ports:
            - containerPort: 8001
            - containerPort: 50051
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "1", memory: "1.5Gi" }
