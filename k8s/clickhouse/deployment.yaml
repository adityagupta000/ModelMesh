apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: modelmesh
spec:
  replicas: 1
  selector:
    matchLabels: { app: clickhouse }
  template:
    metadata:
      labels: { app: clickhouse }
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8-alpine
          env:
            - name: CLICKHOUSE_SKIP_USER_SETUP
              value: "1"
          ports:
            - containerPort: 8123
            - containerPort: 9000
          resources:
            requests: { cpu: "250m", memory: "400Mi" }
            limits: { cpu: "500m", memory: "700Mi" }
